name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build e testes do resultado publicado
        run: |
          cd ..
          npm ci
          npm run build
          cd tests
          TEST_DIST=1 npm test

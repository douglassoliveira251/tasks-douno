    if(ev.recurrenceBaseDate === undefined) ev.recurrenceBaseDate = ev.date || null;
    if(ev.recurrenceEndDate === undefined) ev.recurrenceEndDate = null;
    if(ev.linkedTaskId === undefined) ev.linkedTaskId = null;
    if(ev.endDate === undefined) ev.endDate = ev.date || null;
    if(ev.updatedAt === undefined) ev.updatedAt = ev.createdAt || null;
    if(ev.description === undefined) ev.description = '';
    if(ev.outlookEventId === undefined) ev.outlookEventId = null;
  });
  if(!state.uiGroupCollapse) state.uiGroupCollapse = {};
  if(state.defaultCategoryFilter === undefined) state.defaultCategoryFilter = null;
  if(!state.categoryOrder) state.categoryOrder = 'creation';
  if(!state.categoryGroupModes) state.categoryGroupModes = {};
  if(!state.categoryCalendarViews) state.categoryCalendarViews = {};
  if(!state.theme) state.theme = 'light';
  if(!state.calendarHourDensity) state.calendarHourDensity = 'normal';
  if(!state.calendarViewDefault) state.calendarViewDefault = 'month';
  if(state.weekStartDay === undefined) state.weekStartDay = 0;
  if(!Array.isArray(state.notebooks)) state.notebooks = [];
  if(!state.lastActiveNoteBySpace || typeof state.lastActiveNoteBySpace !== 'object') state.lastActiveNoteBySpace = {};
  state.categories.forEach(cat => {
    const hasNotebook = state.notebooks.some(nb => nb.categoryId === cat.id);
    const hasNotes = state.notes.some(n => n.categoryId === cat.id);
    if(!hasNotebook && hasNotes){
      const nb = { id: uid('nb'), name: 'Notas', categoryId: cat.id, createdAt: Date.now() };
      state.notebooks.push(nb);
      state.notes.forEach(n => { if(n.categoryId === cat.id && !n.notebookId) n.notebookId = nb.id; });
    }
  });
  state.notes.forEach(n => {
    if(n.notebookId === undefined) n.notebookId = null;
    if(n.notebookId){
      const nb = state.notebooks.find(x => x.id === n.notebookId);
      if(!nb || nb.categoryId !== n.categoryId) n.notebookId = null;
    }
    if(!n.notebookId){
      let nb = state.notebooks.find(x => x.categoryId === n.categoryId);
      if(!nb){
        nb = { id: uid('nb'), name: 'Notas', categoryId: n.categoryId, createdAt: Date.now() };
        state.notebooks.push(nb);
      }
      n.notebookId = nb.id;
    }
  });
  if(!state.tagOrder) state.tagOrder = 'creation';
  if(state.showCompletedTasks === undefined) state.showCompletedTasks = false;
  if(!state.notebooksColWidth) state.notebooksColWidth = 260;
  state.tags.forEach(tg => { if(tg.categoryId === undefined) tg.categoryId = null; });
  state.notes.forEach(n => {
    if(n.attachments === undefined) n.attachments = [];
    if(n.tagIds === undefined) n.tagIds = [];
    if(n.linkedTaskId === undefined) n.linkedTaskId = null;
    if(n.pinnedAt === undefined) n.pinnedAt = n.pinned ? (n.updatedAt || Date.now()) : null;
  });
  state.tasks.forEach(t => {
    if(t.description === undefined) t.description = '';
    if(t.dueTime === undefined) t.dueTime = null;
    if(t.tagIds === undefined) t.tagIds = [];
    if(t.recurrence === undefined) t.recurrence = 'none';
    if(t.subtasks === undefined) t.subtasks = [];
    if(t.comments === undefined) t.comments = [];
    if(t.attachments === undefined) t.attachments = [];
    if(t.status === undefined) t.status = t.done ? 'concluida' : 'nao_iniciado';
    if(t.pinnedAt === undefined) t.pinnedAt = t.pinned ? Date.now() : null;
    if(t.completedAt === undefined) t.completedAt = t.done ? (t.updatedAt || t.createdAt || null) : null;
    if(t.recurrenceInterval === undefined) t.recurrenceInterval = 1;
    if(t.recurrenceTime === undefined) t.recurrenceTime = (t.recurrence && t.recurrence !== 'none') ? (t.dueTime || null) : null;
    if(t.recurrenceBaseDate === undefined) t.recurrenceBaseDate = (t.recurrence && t.recurrence !== 'none') ? (t.dueDate || null) : null;
    if(t.recurrenceEndDate === undefined) t.recurrenceEndDate = null;
  });
  if(state.taskIdCounter === undefined) state.taskIdCounter = 0;
  state.tasks.forEach(t => { if(t.shortId && /^t\d+$/.test(t.shortId)) t.shortId = t.shortId.slice(1); });
  const tasksNeedingId = state.tasks.filter(t => !t.shortId).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  tasksNeedingId.forEach(t => {
    state.taskIdCounter++;
    t.shortId = String(state.taskIdCounter).padStart(4, '0');
  });
}

function loadFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.categories){
        state = parsed;
      }
    }
  }catch(e){ console.error('Erro ao carregar localStorage', e); }
  normalizeState();
}

function saveToLocalStorage(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Erro ao salvar localStorage', e); }
}

let autoSaveTimer = null;
const AUTOSAVE_DEBOUNCE_MS = 250;

/* Único ponto que agenda a escrita atrasada, seja pra arquivo local ou pra nuvem -
   markDirty/persistOnly só chamam isto, sem saber qual backend está ativo. */
let cloudWriteInFlight = null;
let cloudWritePending = false;
let cloudWriteFailed = false;
let cloudWriteRetryTimer = null;
/* Sem debounce pra nuvem: um refresh (beforeunload/pagehide) nao espera uma
   escrita assincrona terminar, entao um commit adiado alguns ms podia nunca
   chegar ao Supabase e um refresh logo em seguida lia dados desatualizados.
   Escreve na hora, mas nunca mais de uma escrita em paralelo - um commit que
   chega enquanto outra escrita ja esta em voo so marca "pendente" e dispara
   de novo (com o estado mais atual) assim que a atual terminar, garantindo
   que a ultima escrita a chegar no banco sempre reflete a ultima edicao.

   Bug real corrigido aqui: antes, uma escrita que falhava (rede instavel,
   maquina dormindo no meio do envio, erro do Supabase) caia no .catch(), que so
   logava o erro no console e deixava o .then() seguinte rodar do mesmo jeito -
   e o .then() zerava `dirty` incondicionalmente, como se tivesse salvo com
   sucesso. Com `dirty` mentindo que estava tudo salvo, um refreshFromCloudIfSafe
   seguinte (ex. ao voltar o foco pra janela depois de um tempo) buscava o
   estado antigo do servidor e sobrescrevia a edicao que nunca chegou a ser
   salva, apagando-a silenciosamente. Agora, em caso de erro, `dirty` continua
   true (bloqueando o refresh) e a escrita e tentada de novo automaticamente. */
function triggerCloudWrite(){
  if(cloudWriteInFlight){ cloudWritePending = true; return; }
  clearTimeout(cloudWriteRetryTimer);
  cloudWriteInFlight = writeStateToCloud()
    .then(() => {
      cloudWriteInFlight = null;
      cloudWriteFailed = false;
      dirty = false;
      updateFileStatus();
      if(cloudWritePending){ cloudWritePending = false; triggerCloudWrite(); }
    })
    .catch(e => {
      console.error('Auto-save na nuvem falhou', e);
      cloudWriteInFlight = null;
      cloudWriteFailed = true;
      updateFileStatus();
      cloudWriteRetryTimer = setTimeout(triggerCloudWrite, 8000);
    });
}

function scheduleAutoSave(){
  if(fileHandle){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(async () => {
      try{ await writeStateToFile(); dirty = false; updateFileStatus(); }
      catch(e){ console.error('Auto-save falhou', e); }
    }, AUTOSAVE_DEBOUNCE_MS);
  } else if(cloudSession){
    triggerCloudWrite();
  }
}

async function flushAutoSave(){
  if(!dirty) return;
  if(fileHandle){
    clearTimeout(autoSaveTimer);
    try{ await writeStateToFile(); dirty = false; updateFileStatus(); }
    catch(e){ console.error('Auto-save falhou', e); }
  } else if(cloudSession){
    triggerCloudWrite();
    if(cloudWriteInFlight){ try{ await cloudWriteInFlight; }catch(e){} }
  }
}

function markDirty(){
  dirty = true;
  saveToLocalStorage();
  updateFileStatus();
  render();
  scheduleAutoSave();
}

/* Salva sem re-renderizar a tela inteira — usado em blur de campos de texto para não
   destruir o elemento que o usuário acabou de clicar (ex: seletor de fonte/cor) no meio da interação. */
function persistOnly(){
  dirty = true;
  saveToLocalStorage();
  updateFileStatus();
  scheduleAutoSave();
}

// Garante que alterações pendentes sejam gravadas antes de a aba ser minimizada,
// trocada ou fechada — evita perder a última edição feita bem antes do debounce disparar.
function commitOpenEditors(){
  if(currentNoteComposerCommit){
    try{ currentNoteComposerCommit(); }catch(e){ console.error(e); }
  }
  /* Título e descrição da tarefa já commitam no blur (protegidos pelo blur()
     genérico abaixo). O campo de novo comentário é a exceção: só grava quando
     o usuário clica em "Adicionar", então um rascunho digitado ali e nunca
     enviado ficava só na memória do DOM — se a aba fosse escondida/fechada
     nesse meio tempo, o rascunho se perdia sem nenhum aviso. */
  const newCommentBox = document.getElementById('tpNewComment');
  if(newCommentBox && newCommentBox.value.trim()){
    const addBtn = document.getElementById('tpAddCommentBtn');
    if(addBtn) try{ addBtn.click(); }catch(e){ console.error(e); }
  }
  if(document.activeElement && typeof document.activeElement.blur === 'function'){
    try{ document.activeElement.blur(); }catch(e){}
  }
}
document.addEventListener('visibilitychange', () => { if(document.hidden){ commitOpenEditors(); flushAutoSave(); } });
window.addEventListener('beforeunload', () => { commitOpenEditors(); flushAutoSave(); });
window.addEventListener('pagehide', () => { commitOpenEditors(); flushAutoSave(); });

function isEditingSomething(){
  const el = document.activeElement;
  if(!el) return false;
  return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable;
}
/* Bug real: com o sistema aberto em duas janelas, editar e salvar numa nao atualizava
   o state em memoria da outra - ela continuava com a foto antiga carregada no boot, e
   ao editar e salvar algo la, sua escrita (o blob inteiro) sobrescrevia a mudanca feita
   na primeira janela. Ao voltar o foco pra uma aba/janela, se nao ha nada sendo digitado
   nem uma escrita pendente, busca o estado mais recente da nuvem antes que o usuario
   comece a editar ali - assim a escrita seguinte parte sempre do dado mais atual. */
let cloudRefreshInFlight = false;
async function refreshFromCloudIfSafe(){
  if(!sbClient || !cloudSession) return;
  if(dirty || cloudWriteInFlight || cloudWritePending) return;
  if(isEditingSomething()) return;
  if(cloudRefreshInFlight) return;
  cloudRefreshInFlight = true;
  try{
    const data = await fetchCloudStateRow();
    /* A busca é assíncrona — o usuário pode ter começado a editar algo
       enquanto ela estava em andamento. Se isso aconteceu, descarta o
       resultado buscado em vez de sobrescrever a edição em curso (era
       exatamente isso que apagava o que a pessoa acabara de digitar). */
    if(dirty || isEditingSomething()) return;
    if(data && data.data && typeof data.data === 'object'){
      state = data.data;
      normalizeState();
      render();
    }
  }catch(e){ console.error('Erro ao atualizar dados da nuvem', e); }
  finally{ cloudRefreshInFlight = false; }
}
window.addEventListener('focus', refreshFromCloudIfSafe);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshFromCloudIfSafe(); });

function updateFileStatus(){
  const dotSettings = document.getElementById('statusDotSettings');
  const textSettings = document.getElementById('statusTextSettings');
  const cls = 'status-dot ' + (dirty ? 'dirty' : 'saved');
  const title = dirty ? 'Alterações não salvas' : 'Sincronizado';
  const badge = document.getElementById('saveErrorBadge');
  if(badge) badge.style.display = cloudWriteFailed ? 'flex' : 'none';
  if(cloudSession){
    if(dotSettings){ dotSettings.className = cloudWriteFailed ? 'status-dot dirty' : cls; dotSettings.title = cloudWriteFailed ? 'Falha ao salvar na nuvem — tentando de novo' : title; }
    if(textSettings) textSettings.textContent = `${cloudSession.user.email} (nuvem)`;
  } else if(fileHandle){
    const name = fileHandle.name || 'douno-tasks.json';
    if(dotSettings){ dotSettings.className = cls; dotSettings.title = title; }
    if(textSettings) textSettings.textContent = name;
  } else {
    if(dotSettings){ dotSettings.className = 'status-dot'; dotSettings.title = ''; }
    if(textSettings) textSettings.textContent = 'Sem arquivo conectado';
  }
}

async function saveFileAs(){
  if(!window.showSaveFilePicker){ downloadFallback(); return; }

      suggestedName: 'douno-tasks.json',
      types: [{ description: 'DOUNO Tasks JSON', accept: {'application/json': ['.json']} }]
    });
    fileHandle = handle;
    await writeStateToFile();
    await idbSetHandle('main', handle);
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    updateFileStatus();
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}

async function openFile(){
  if(!window.showOpenFilePicker){
    alert('Seu navegador não suporta a File System Access API. Use Chrome ou Edge para abrir/salvar o douno-tasks.json diretamente. Enquanto isso, os dados continuam salvos no navegador.');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'DOUNO Tasks JSON', accept: {'application/json': ['.json']} }]
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(parsed && parsed.categories){
      state = parsed;
      normalizeState();
      applyTheme();
      fileHandle = handle;
      await idbSetHandle('main', handle);
      localStorage.removeItem('tyvraSkipFileLink');
      dirty = false;
      saveToLocalStorage();
      updateFileStatus();
      render();
    } else {
      alert('Arquivo inválido para o DOUNO Tasks.');
    }
  }catch(e){
    if(e.name !== 'AbortError') console.error(e);
  }
}

async function saveFile(){
  if(!window.showSaveFilePicker){
    downloadFallback();
    return;
  }
  try{
    if(!fileHandle){
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'douno-tasks.json',
        types: [{ description: 'DOUNO Tasks JSON', accept: {'application/json': ['.json']} }]
      });
      await idbSetHandle('main', fileHandle);
      localStorage.removeItem('tyvraSkipFileLink');
    }
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    dirty = false;
    updateFileStatus();
  }catch(e){
    if(e.name !== 'AbortError') console.error(e);
  }
}

function downloadFallback(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'douno-tasks.json'; a.click();
  URL.revokeObjectURL(url);
}

/* ===================== HELPERS ===================== */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function catById(id){ return state.categories.find(c => c.id === id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y.slice(2)}`;
}
function fmtFriendlyDate(d){
  if(!d) return '';
  const todayS = todayStr();
  if(d === todayS) return 'Hoje';
  if(d === addDaysStr(todayS, 1)) return 'Amanhã';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtEditedLabel(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const timeStr = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const dStr = dateToStr(d);
  const todayS = todayStr();
  const yestS = addDaysStr(todayS, -1);
  if(dStr === todayS) return `hoje, ${timeStr}`;
  if(dStr === yestS) return `ontem, ${timeStr}`;
  const [y,m,day] = dStr.split('-');
  return `em ${day}/${m}/${y}`;
}
function isOverdue(d, done){
  if(!d || done) return false;
  return new Date(d + 'T23:59:59') < new Date();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dateToStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return dateToStr(new Date()); }
const DEFAULT_DUE_TIME = '08:00';

function advanceDateByRecurrence(dateStr, recurrence, interval){
  const n = Math.max(1, parseInt(interval, 10) || 1);
  const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  switch(recurrence){
    case 'daily': base.setDate(base.getDate()+n); break;
    case 'weekly': base.setDate(base.getDate()+7*n); break;
    case 'monthly': base.setMonth(base.getMonth()+n); break;
    case 'yearly': base.setFullYear(base.getFullYear()+n); break;
    default: return dateStr;
  }
  return dateToStr(base);
}

function spawnNextRecurrence(task){
  /* A proxima data parte sempre do "A partir de" (recurrenceBaseDate), nunca do
     dueDate atual: dueDate é só quando o usuário planeja fazer essa ocorrência e
     pode ser editado livremente (ex. adiar de dia 1 pra dia 4) sem afetar o
     cálculo da recorrência. Sem isso, editar o prazo antes de concluir mudava
     a base do cálculo e desalinhava a cadência (ex. semanal criada dia 1,
     replanejada pra dia 4 e concluída ali, gerava a próxima em dia 11 em vez
     de dia 8). */
  const baseDate = task.recurrenceBaseDate || task.dueDate;
  const nextDueDate = advanceDateByRecurrence(baseDate, task.recurrence, task.recurrenceInterval);
  if(task.recurrenceEndDate && nextDueDate > task.recurrenceEndDate) return null;
  state.taskIdCounter = (state.taskIdCounter || 0) + 1;
  const next = {
    id: uid('task'),
    shortId: String(state.taskIdCounter).padStart(4, '0'),
    title: task.title,
    categoryId: task.categoryId,
    done: false,
    status: 'nao_iniciado',
    dueDate: nextDueDate,
    dueTime: task.dueTime,
    priority: task.priority,
    description: task.description || '',
    tagIds: (task.tagIds||[]).slice(),
    recurrence: task.recurrence,
    recurrenceInterval: task.recurrenceInterval || 1,
    /* Vira o novo "A partir de": a proxima ocorrencia calcula a data dela a
       partir desta, mantendo a cadencia (ex. semanal) andando certinho mesmo
       que essa ocorrencia seja concluida atrasada ou tenha o prazo editado. */
    recurrenceBaseDate: nextDueDate,
    recurrenceEndDate: task.recurrenceEndDate || null,
    subtasks: (task.subtasks||[]).map(s => ({ id: uid('sub'), title: s.title, done:false })),
    comments: [],
    attachments: [],
    createdAt: Date.now()
  };
  state.tasks.push(next);
  return next;
}

let taskGroupMode = 'periodo'; // 'periodo' | 'grupos' | 'prioridade'

function periodBoundaries(){
  const now = new Date();
  const todayS = todayStr();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  const tomorrowS = dateToStr(tomorrow);
  const dow = now.getDay();
  const endOfWeek = new Date(now); endOfWeek.setDate(now.getDate() + ((7 - dow) % 7));
  const endOfWeekS = dateToStr(endOfWeek);
  const endOfNextWeek = new Date(endOfWeek); endOfNextWeek.setDate(endOfWeek.getDate()+7);
  const endOfNextWeekS = dateToStr(endOfNextWeek);
  const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const endOfMonthS = dateToStr(endOfMonth);
  return { todayS, tomorrowS, endOfWeekS, endOfNextWeekS, endOfMonthS };
}

function periodBucketKeyFor(dueDate){
  if(!dueDate) return 'sem_prazo';
  const { todayS, tomorrowS, endOfWeekS, endOfNextWeekS, endOfMonthS } = periodBoundaries();
  if(dueDate < todayS) return 'vencido';
  if(dueDate === todayS) return 'hoje';
  if(dueDate === tomorrowS) return 'amanha';
  if(dueDate <= endOfWeekS) return 'semana';
  if(dueDate <= endOfNextWeekS) return 'proxima_semana';
  if(dueDate <= endOfMonthS) return 'mes';
  return 'depois';
}

const PERIOD_CONFIG = [
  { key:'vencido', label:'Vencida', color:'var(--danger)' },
  { key:'hoje', label:'Vence hoje', color:'var(--priority-alta)' },
  { key:'amanha', label:'Amanhã', color:'var(--ink-soft)' },
  { key:'semana', label:'Nessa semana', color:'var(--ink-soft)' },
  { key:'proxima_semana', label:'Próxima semana', color:'var(--ink-soft)' },
  { key:'mes', label:'Neste mês', color:'var(--ink-faint)' },
  { key:'depois', label:'Mais tarde', color:'var(--ink-faint)' },
  { key:'sem_prazo', label:'Sem prazo', color:'var(--ink-faint)' }
];

function computeTaskGroups(){
  const term = searchTerm.trim().toLowerCase();
  let pool = state.tasks.filter(t => !activeCategoryFilter || t.categoryId === activeCategoryFilter);
  if(term) pool = pool.filter(t => t.title.toLowerCase().includes(term));
  if(activeTagFilters.length) pool = pool.filter(t => (t.tagIds||[]).some(id => activeTagFilters.includes(id)));
  if(activeCriticalityFilters.length) pool = pool.filter(t => activeCriticalityFilters.includes(t.priority||'media'));
  pool = pool.filter(t => !t.done);

  if(taskGroupMode === 'prioridade'){
    const order = [...PRIORITY_CONFIG].reverse().concat([{key:null,label:'Sem prioridade',color:'var(--ink-faint)'}]);
    return order.map(p => ({
      key: p.key || 'sem_prioridade', label: p.label, color: p.color,
      tasks: pool.filter(t => (t.priority||null) === p.key),
      quickAddDefaults: { priority: p.key }
    }));
  }
  if(taskGroupMode === 'status'){
    return STATUS_CONFIG.map(s => ({
      key: s.key, label: s.label, color: 'var(--ink-faint)',
      tasks: pool.filter(t => (t.status||'nao_iniciado') === s.key),
      quickAddDefaults: { status: s.key }
    }));
  }
  if(taskGroupMode === 'tags'){
    const groups = state.tags.map(tg => ({
      key: tg.id, label: tg.name, color: tg.color,
      tasks: pool.filter(t => (t.tagIds||[]).includes(tg.id)),
      quickAddDefaults: {}
    }));
    groups.push({
      key: 'sem_tag', label: 'Sem tag', color: 'var(--ink-faint)',
      tasks: pool.filter(t => !(t.tagIds||[]).length),
      quickAddDefaults: {}
    });
    return groups;
  }
  if(taskGroupMode === 'periodo'){
    return PERIOD_CONFIG.map(p => ({
      key:p.key, label:p.label, color:p.color,
      tasks: pool.filter(t => periodBucketKeyFor(t.dueDate) === p.key),
      quickAddDefaults: { dueDateKey: p.key }
    }));
  }
  // grupos (espaço)
  const cats = activeCategoryFilter ? state.categories.filter(c=>c.id===activeCategoryFilter) : state.categories;
  return cats.map(cat => ({
    key: cat.id, label: cat.name, color: cat.color,
    tasks: pool.filter(t => t.categoryId === cat.id),
    quickAddDefaults: { categoryId: cat.id }
  }));
}

function computeCompletedGroup(){
  const term = searchTerm.trim().toLowerCase();
  let pool = state.tasks.filter(t => t.done);
  pool = pool.filter(t => !activeCategoryFilter || t.categoryId === activeCategoryFilter);
  if(term) pool = pool.filter(t => t.title.toLowerCase().includes(term));
  if(activeTagFilters.length) pool = pool.filter(t => (t.tagIds||[]).some(id => activeTagFilters.includes(id)));
  if(activeCriticalityFilters.length) pool = pool.filter(t => activeCriticalityFilters.includes(t.priority||'media'));
  pool.sort((a,b) => (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  return { key:'concluidas', label:'Concluídas', color:'var(--ink-faint)', tasks: pool };
}

function quickAddDueDateFor(key){
  if(!key) return todayStr();
  const { todayS, tomorrowS, endOfWeekS } = periodBoundaries();
  if(key === 'hoje') return todayS;
  if(key === 'amanha') return tomorrowS;
  if(key === 'semana') return endOfWeekS;
  if(key === 'vencido' || key === 'sem_prazo') return todayS;
  return todayS;
}

        <span id="critFilterLabel">Prioridade</span>

      <div class="tag-filter-popover" id="critFilterPopover" style="display:${criticalityFilterPopoverOpen?'block':'none'};">
        ${PRIORITY_CONFIG.map(p => `
          <label class="tag-filter-row">
            <input type="checkbox" data-crit="${p.key}" ${activeCriticalityFilters.includes(p.key)?'checked':''}>
            <span class="cat-swatch" style="background:${p.color}"></span>
            ${p.label}
          </label>
        `).join('')}
        <button type="button" class="filter-clear-btn" id="critFilterClearBtn" ${activeCriticalityFilters.length?'':'disabled'}>Limpar filtro</button>
      </div>
    </div>
    <div class="tag-filter-control">
      <button type="button" class="tag-filter-btn" id="tagFilterBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24H4a1 1 0 00-1 1v5.59a2 2 0 00.59 1.41l9.58 9.58a2 2 0 002.82 0l5.6-5.59a2 2 0 000-2.82z"/><circle cx="7" cy="7" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span id="tagFilterLabel">Tags</span>
      </button>
      <div class="tag-filter-popover" id="tagFilterPopover" style="display:${tagFilterPopoverOpen?'block':'none'};">
        ${(() => {

            .forEach(t => (t.tagIds||[]).forEach(id => usedTagIds.add(id)));

  };

  groupModeDropdown.querySelectorAll('.tp-status-option').forEach(opt => {
    opt.onclick = () => {
      taskGroupMode = opt.dataset.mode;
      if(activeCategoryFilter){
        state.categoryGroupModes[activeCategoryFilter] = taskGroupMode;
        markDirty();
      } else {
        render();
      }
    };
  });

  const critFilterBtn = groupBar.querySelector('#critFilterBtn');
  const critFilterPopoverEl = groupBar.querySelector('#critFilterPopover');
  critFilterBtn.onclick = (e) => {
    e.stopPropagation();
    const willOpen = !criticalityFilterPopoverOpen;
    closeOtherTaskFilterPopovers(critFilterPopoverEl);
    criticalityFilterPopoverOpen = willOpen;
    critFilterPopoverEl.style.display = criticalityFilterPopoverOpen ? 'block' : 'none';
  };
  critFilterPopoverEl.addEventListener('click', e => e.stopPropagation());
  critFilterPopoverEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      const key = e.target.dataset.crit;
      if(e.target.checked){ if(!activeCriticalityFilters.includes(key)) activeCriticalityFilters.push(key); }
      else { activeCriticalityFilters = activeCriticalityFilters.filter(k => k !== key); }
      render();
    });
  });
  const critFilterClearBtn = groupBar.querySelector('#critFilterClearBtn');
  if(critFilterClearBtn){
    critFilterClearBtn.addEventListener('click', e => {
      e.stopPropagation();
      activeCriticalityFilters = [];
      render();
    });
  }

  const tagFilterBtn = groupBar.querySelector('#tagFilterBtn');
  const tagFilterPopoverEl = groupBar.querySelector('#tagFilterPopover');
  tagFilterBtn.onclick = (e) => {

    tagFilterPopoverEl.style.display = tagFilterPopoverOpen ? 'block' : 'none';

  tagFilterPopoverEl.addEventListener('click', e => e.stopPropagation());
  tagFilterPopoverEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      const tagId = e.target.dataset.tag;
      if(e.target.checked){ if(!activeTagFilters.includes(tagId)) activeTagFilters.push(tagId); }
      else { activeTagFilters = activeTagFilters.filter(id => id !== tagId); }
      render();
    });
  });
  const tagFilterClearBtn = groupBar.querySelector('#tagFilterClearBtn');
  if(tagFilterClearBtn){
    tagFilterClearBtn.addEventListener('click', e => {
      e.stopPropagation();
      activeTagFilters = [];
      render();
    });
  }
  const clearAllFiltersBtn = groupBar.querySelector('#clearAllFiltersBtn');
  if(clearAllFiltersBtn){
    clearAllFiltersBtn.addEventListener('click', () => {
      activeTagFilters = [];
      activeCriticalityFilters = [];
      tagFilterPopoverOpen = false;
      criticalityFilterPopoverOpen = false;
      render();
    });
  }

  groupBar.querySelector('#showCompletedToggle').addEventListener('change', e => {
    state.showCompletedTasks = e.target.checked;
    markDirty();
  });

  view.appendChild(groupBar);

  const layout = document.createElement('div');
  layout.className = 'tasks-layout';
  const listCol = document.createElement('div');
  listCol.className = 'tasks-list-col';
  layout.appendChild(listCol);
  view.appendChild(layout);

  const groups = computeTaskGroups();
  let anyTask = false;

  function buildBucket(group, isCompletedGroup){
    group.tasks.sort((a,b) => (a.done - b.done) || ((a.dueDate||'9999') > (b.dueDate||'9999') ? 1 : -1));
    if(group.tasks.length === 0) return;
    anyTask = anyTask || group.tasks.length > 0;

    const collapsed = !!state.uiGroupCollapse[group.key];
    const bucket = document.createElement('div');
    bucket.className = 'bucket' + (collapsed ? ' collapsed' : '');
    bucket.innerHTML = `
      <div class="bucket-header">
        <span class="bucket-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
        ${(!isCompletedGroup && (taskGroupMode === 'grupos' || taskGroupMode === 'prioridade')) ? `<span class="cat-swatch" style="background:${group.color}"></span>` : ''}
        <span class="bucket-title">${escapeHtml(group.label)}</span>
        <span class="bucket-count">${group.tasks.length}</span>
      </div>
      <div class="bucket-body">
        <div class="task-list"></div>
      </div>
    `;
    bucket.querySelector('.bucket-header').addEventListener('click', () => {
      state.uiGroupCollapse[group.key] = !state.uiGroupCollapse[group.key];
      markDirty();
    });
    const taskListEl = bucket.querySelector('.task-list');
    group.tasks.forEach(t => taskListEl.appendChild(renderTaskRow(t)));

    listCol.appendChild(bucket);
  }

  groups.forEach(group => buildBucket(group, false));

  if(state.showCompletedTasks){
    buildBucket(computeCompletedGroup(), true);
  }

  if(!anyTask && state.tasks.length === 0){
    listCol.insertAdjacentHTML('beforeend', `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <p>Nenhuma tarefa ainda. Clique em "+ Nova tarefa" ou use o campo "+ Adicionar tarefa" em qualquer espaço.</p>
    </div>`);
  }

  if(activeTaskId || creatingNewTask){
    listCol.classList.add('with-panel');
    const panel = document.createElement('div');
    panel.className = 'task-panel';
    layout.appendChild(panel);
    renderTaskPanel(panel);
  }
}

function renderTaskRow(t){
  const row = document.createElement('div');
  const priClass = t.priority ? ` pri-${t.priority}` : '';
  const overdue = isOverdue(t.dueDate, t.done);
  row.className = 'task-row' + priClass + (t.done ? ' done' : '') + (t.id === activeTaskId ? ' selected' : '') + (overdue ? ' overdue' : '');
  row.dataset.id = t.id;
  const isToday = t.dueDate === todayStr();
  const tags = (t.tagIds||[]).map(id => state.tags.find(tg=>tg.id===id)).filter(Boolean);
  const commentCount = (t.comments||[]).length;
  const subtasks = t.subtasks || [];
  const subDone = subtasks.filter(s=>s.done).length;

  let statusPill = '';
  if(overdue) statusPill = `<span class="task-status-pill overdue">Vencida</span>`;
  else if(isToday && !t.done) statusPill = `<span class="task-status-pill today">Hoje</span>`;

  row.innerHTML = `
    <div class="task-check task-check-circle ${t.done?'done':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="task-row-left">
      <span class="task-id-badge">${t.shortId||''}</span>
      <span class="task-title">${escapeHtml(t.title || 'Sem título')}</span>
      <span class="task-status-label">${(STATUS_CONFIG.find(s=>s.key===(t.status||'nao_iniciado'))||STATUS_CONFIG[0]).label}</span>
      ${t.dueDate ? `<span class="task-cal-badge ${overdue?'overdue':''}" style="margin-left:10px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${fmtDate(t.dueDate)}${t.dueTime ? ' '+t.dueTime : ''}</span>` : ''}
      ${subtasks.length ? `<span class="task-subtask-badge">${subDone}/${subtasks.length}</span>` : ''}
      ${tags.length ? `<span class="task-tag-pill" style="background:${tags[0].color}22; color:${tags[0].color};"><span class="dot" style="background:${tags[0].color}"></span>${escapeHtml(tags[0].name)}</span>` : ''}
      ${tags.length > 1 ? `<span class="task-tag-more" title="${tags.slice(1).map(t=>t.name).join(', ')}">+${tags.length-1}</span>` : ''}
    </div>
    <div class="task-row-right">
      ${commentCount ? `<span class="task-comment-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>${commentCount}</span>` : ''}
      ${(t.recurrence && t.recurrence !== 'none') ? `<span class="task-recurrence-icon" title="Recorrente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 014-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 01-4 4H3"/></svg></span>` : ''}
      ${statusPill}
      <div class="task-menu-wrap">
        <button class="task-menu-btn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="19" r="2.1"/></svg></button>
      </div>
    </div>
  `;
  row.querySelector('.task-check').onclick = (e) => {
    e.stopPropagation();
    const wasDone = t.done;
    t.done = !t.done;
    t.status = t.done ? 'concluida' : 'nao_iniciado';
    t.completedAt = t.done ? Date.now() : null;
    if(!wasDone && t.done && t.recurrence && t.recurrence !== 'none'){
      const next = spawnNextRecurrence(t);
      if(next){
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        markDirty();
        openTaskPanel(next.id);
        return;
      }
    }
    markDirty();
  };

  const menuWrap = row.querySelector('.task-menu-wrap');
  const menuBtn = row.querySelector('.task-menu-btn');
  menuBtn.onclick = (e) => {
    e.stopPropagation();
    const wasOpen = menuWrap.classList.contains('open');
    closeAllTaskMenus();
    if(!wasOpen) openTaskRowMenu(t, menuBtn, menuWrap);
  };

  row.addEventListener('click', () => openTaskPanel(t.id));
  return row;
}

/* ---- menu-portal dos 3 pontinhos (fixo, nunca cortado pelos grupos) ---- */
let openMenuWrapEl = null;

function ensureTaskMenuPortal(){
  let portal = document.getElementById('taskMenuPortal');
  if(!portal){
    portal = document.createElement('div');
    portal.id = 'taskMenuPortal';
    portal.className = 'task-menu-portal';
    document.body.appendChild(portal);
  }
  return portal;
}

function closeAllTaskMenus(){
  if(openMenuWrapEl){ openMenuWrapEl.classList.remove('open'); openMenuWrapEl = null; }
  const portal = document.getElementById('taskMenuPortal');
  if(portal) portal.classList.remove('show');
}

function openTaskRowMenu(task, btnEl, wrapEl){
  const portal = ensureTaskMenuPortal();
  portal.innerHTML = `
    <button type="button" class="task-menu-item" data-action="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Editar</button>
    <button type="button" class="task-menu-item" data-action="duplicate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Duplicar</button>
    <button type="button" class="task-menu-item" data-action="move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg>Mover de espaço</button>
    <button type="button" class="task-menu-item danger" data-action="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg>Excluir</button>
  `;
  const rect = btnEl.getBoundingClientRect();
  portal.style.top = Math.round(rect.bottom + 6) + 'px';
  portal.style.right = Math.round(window.innerWidth - rect.right) + 'px';
  portal.style.left = 'auto';
  portal.classList.add('show');
  wrapEl.classList.add('open');
  openMenuWrapEl = wrapEl;

  portal.querySelector('[data-action="edit"]').onclick = (e) => {
    e.stopPropagation();
    closeAllTaskMenus();
    openTaskPanel(task.id);
  };
  portal.querySelector('[data-action="duplicate"]').onclick = (e) => {
    e.stopPropagation();
    closeAllTaskMenus();
    const copy = JSON.parse(JSON.stringify(task));
    copy.id = uid('task');
    copy.title = task.title + ' (cópia)';
    copy.done = false;
    copy.createdAt = Date.now();
    (copy.subtasks||[]).forEach(s => s.id = uid('sub'));
    (copy.comments||[]).forEach(c => c.id = uid('cmt'));
    state.tasks.push(copy);
    markDirty();
  };
  portal.querySelector('[data-action="move"]').onclick = (e) => {
    e.stopPropagation();
    openMoveGroupPortal(e.currentTarget, task.categoryId, (newCatId) => {
      task.categoryId = newCatId;
      task.tagIds = (task.tagIds||[]).filter(id => {
        const tg = state.tags.find(x => x.id === id);
        return tg && (!tg.categoryId || tg.categoryId === newCatId);
      });
      markDirty();
    });
    closeAllTaskMenus();
  };
  portal.querySelector('[data-action="delete"]').onclick = (e) => {
    e.stopPropagation();
    closeAllTaskMenus();
    state.tasks = state.tasks.filter(x => x.id !== task.id);
    if(activeTaskId === task.id) activeTaskId = null;
    markDirty();
  };
}

function renderUnifiedTagPicker(portal, opts){
  const { categoryId, isSelected, onToggle, onChanged } = opts;
  portal.innerHTML = `
    <div class="search-input-wrap">
      <input type="text" class="tag-picker-search" id="tagPickerSearch_${portal.id}" placeholder="Buscar ou criar tag..." autocomplete="off">
      <button type="button" class="search-clear-btn" style="display:none;" title="Limpar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="tp-tags-popover-list" id="tagPickerList_${portal.id}"></div>
  `;
  const searchInput = portal.querySelector(`#tagPickerSearch_${portal.id}`);
  const list = portal.querySelector(`#tagPickerList_${portal.id}`);
  const clearBtn = portal.querySelector('.search-clear-btn');
  clearBtn.onclick = (e) => { e.stopPropagation(); searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.focus(); };

  function renderList(){
    const term = searchInput.value.trim().toLowerCase();
    const visibleTags = state.tags.filter(tg => !tg.categoryId || tg.categoryId === categoryId);
    const matchFilter = tg => !term || tg.name.toLowerCase().includes(term);
    const ofGroup = visibleTags.filter(tg => tg.categoryId === categoryId && matchFilter(tg));
    const general = visibleTags.filter(tg => !tg.categoryId && matchFilter(tg));
    const renderRow = tg => `
      <div class="tp-tags-popover-row" data-tag="${tg.id}">
        <button type="button" class="tag-row-color-dot" data-tag-color="${tg.id}" style="background:${tg.color}" title="Alterar cor"></button>
        <span class="tp-tags-popover-name">${escapeHtml(tg.name)}</span>
        ${isSelected(tg.id) ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="13" height="13"><path d="M20 6L9 17l-5-5"/></svg>` : ''}
      </div>`;
    const exactMatch = visibleTags.some(tg => tg.name.toLowerCase() === term);
    let html = '';
    if(ofGroup.length) html += `<div class="tp-tags-popover-section">Deste espaço</div>` + ofGroup.map(renderRow).join('');
    if(general.length) html += `<div class="tp-tags-popover-section">Gerais</div>` + general.map(renderRow).join('');
    if(term && !exactMatch){
      html += `<div class="tp-tags-popover-row tag-create-row" data-create="1"><span class="tp-tags-popover-name">+ Criar tag "${escapeHtml(searchInput.value.trim())}"</span></div>`;
    }
    if(!html){
      html = '<div style="font-size:12px;color:var(--ink-faint); padding:6px 4px;">Nenhuma tag encontrada</div>';
    }
    list.innerHTML = html;

    list.querySelectorAll('.tp-tags-popover-row[data-tag]').forEach(row => {
      row.addEventListener('click', (e) => {
        if(e.target.closest('.tag-row-color-dot')) return;
        onToggle(row.dataset.tag);
        renderList();
        if(onChanged) onChanged();
      });
      const colorDot = row.querySelector('.tag-row-color-dot');
      colorDot.onclick = (e) => {
        e.stopPropagation();
        const tag = state.tags.find(t => t.id === row.dataset.tag);
        if(!tag) return;
        openColorPortal(tag.color, colorDot, (color) => {
          tag.color = color;
          colorDot.style.background = color;
          markDirty();
          if(onChanged) onChanged();
        });
      };
    });
    const createRow = list.querySelector('[data-create]');
    if(createRow){
      createRow.onclick = () => {
        const name = searchInput.value.trim();
        if(!name) return;
        const color = DEFAULT_COLORS[state.tags.length % DEFAULT_COLORS.length];
        const newTag = { id: uid('tag'), name, color, categoryId };
        state.tags.push(newTag);
        onToggle(newTag.id);
        searchInput.value = '';
        renderList();
        if(onChanged) onChanged();
      };
    }
  }
  searchInput.addEventListener('input', renderList);
  searchInput.addEventListener('input', () => { const cb = portal.querySelector('.search-clear-btn'); if(cb) cb.style.display = searchInput.value ? 'flex' : 'none'; });
  searchInput.addEventListener('click', e => e.stopPropagation());
  searchInput.addEventListener('keydown', e => e.stopPropagation());
  renderList();
  setTimeout(() => searchInput.focus(), 0);
}

      </div>
    </div>
    ` : ''}
  `;
  function refreshAfterToggleChange(){
    markDirty();
    onChange();
    const freshAnchor = document.getElementById('tpRecurrenceTrigger');
    if(freshAnchor) portal._anchorBtn = freshAnchor;
    renderRecurrencePortalContent(portal, task, onChange);
    positionTagsPortalNear(portal, portal._anchorBtn);
  }
  const enabledCheckbox = portal.querySelector('#recPopEnabled');
  enabledCheckbox.addEventListener('click', e => e.stopPropagation());
  enabledCheckbox.addEventListener('change', e => {
    if(e.target.checked){
      task.recurrence = (task.recurrence && task.recurrence !== 'none') ? task.recurrence : 'daily';
      if(!task.recurrenceInterval) task.recurrenceInterval = 1;
      if(!task.recurrenceBaseDate) task.recurrenceBaseDate = task.dueDate || todayStr();
    } else {
      task.recurrence = 'none';
    }
    refreshAfterToggleChange();
  });
  const unitSelect = portal.querySelector('#recPopUnit');
  if(unitSelect){
    unitSelect.addEventListener('click', e => e.stopPropagation());
    unitSelect.addEventListener('change', e => {
      task.recurrence = e.target.value;
      persistOnly();
      onChange();
    });
  }
  const intervalInput = portal.querySelector('#recPopInterval');
  if(intervalInput){
    intervalInput.addEventListener('click', e => e.stopPropagation());
    intervalInput.addEventListener('change', e => {
      task.recurrenceInterval = Math.max(1, parseInt(e.target.value,10)||1);
      persistOnly();
      onChange();
    });
  }
  const baseDateInput = portal.querySelector('#recPopBaseDate');
  if(baseDateInput){
    baseDateInput.addEventListener('click', e => e.stopPropagation());
    baseDateInput.addEventListener('change', e => {
      task.recurrenceBaseDate = e.target.value;
      task.dueDate = e.target.value;
      persistOnly();
      onChange();
      const dateField = document.getElementById('tpDate');
      if(dateField) dateField.value = e.target.value;
    });
  }
  const endDateInput = portal.querySelector('#recPopEndDate');
  if(endDateInput){
    endDateInput.addEventListener('click', e => e.stopPropagation());
    endDateInput.addEventListener('change', e => {
      task.recurrenceEndDate = e.target.value || null;
      persistOnly();
      onChange();
    });
  }
}

document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(currentView === 'tasks' && (activeTaskId || creatingNewTask)){
    closeTaskPanel();
    return;
  }
  if(currentView === 'notes' && (activeNoteId || creatingNewNote)){
    closeNoteComposer();
    return;
  }
  if(document.getElementById('eventComposerOverlay').classList.contains('show')){
    closeEventComposer();
    return;
  }
  if(document.getElementById('aboutOverlay').classList.contains('show')){
    closeAboutModal();
    return;
  }
  if(document.getElementById('helpPanel').classList.contains('show')){
    closeHelpPanel();
    return;
  }
  if(document.querySelector('.sidebar').classList.contains('mobile-open')){
    closeMobileSidebar();
    return;
  }
  if(document.getElementById('searchResultsDropdown').style.display !== 'none'){
    closeSearchResultsDropdown();
  }
});

document.addEventListener('click', (e) => {
  if(!tagsPopoverOpen) return;
  const popover = document.getElementById('tpTagsPopover');
  const toggleBtn = document.getElementById('tpTagsToggleBtn');
  if(popover && toggleBtn && !popover.contains(e.target) && !toggleBtn.contains(e.target)){
    tagsPopoverOpen = false;
    render();
  }
});


function getOrCreateActiveTask(){
  if(creatingNewTask){
    const defaultCat = (activeCategoryFilter && catById(activeCategoryFilter)) ? activeCategoryFilter : state.categories[0].id;
    state.taskIdCounter = (state.taskIdCounter || 0) + 1;
    const t = {
      id: uid('task'), shortId: String(state.taskIdCounter).padStart(4, '0'),
      title:'', categoryId: defaultCat, done:false, status:'nao_iniciado',
      dueDate: todayStr(), dueTime: DEFAULT_DUE_TIME, priority:'media', description:'',
      tagIds:[], recurrence:'none', subtasks:[], comments:[], attachments:[], createdAt: Date.now()
    };
    state.tasks.push(t);
    activeTaskId = t.id;
    creatingNewTask = false;
    return t;
  }
  return state.tasks.find(x => x.id === activeTaskId);
}

const RECURRENCE_LABELS = { none:'Não repete', daily:'Diariamente', weekly:'Semanalmente', monthly:'Mensalmente', yearly:'Anualmente' };
const RECURRENCE_UNIT_SINGULAR = { daily:'dia', weekly:'semana', monthly:'mês', yearly:'ano' };
const RECURRENCE_UNIT_PLURAL = { daily:'dias', weekly:'semanas', monthly:'meses', yearly:'anos' };

function recurrenceSummaryLabel(task){
  if(!task.recurrence || task.recurrence === 'none') return 'Não repete';
  const n = task.recurrenceInterval || 1;
  if(n === 1) return RECURRENCE_LABELS[task.recurrence];
  return `A cada ${n} ${RECURRENCE_UNIT_PLURAL[task.recurrence]}`;
}

function renderTaskPanel(panel){
  const task = creatingNewTask
    ? { title:'', categoryId:(activeCategoryFilter && catById(activeCategoryFilter)) ? activeCategoryFilter : state.categories[0].id, dueDate:todayStr(), dueTime:DEFAULT_DUE_TIME, priority:'media', description:'', tagIds:[], recurrence:'none', subtasks:[], comments:[] }
    : state.tasks.find(x => x.id === activeTaskId);

  if(!task){ closeTaskPanel(); return; }

  const catOptions = state.categories.map(c => `<option value="${c.id}" ${c.id===task.categoryId?'selected':''}>${escapeHtml(c.name)}</option>`).join('');

  const overdue = isOverdue(task.dueDate, task.done);
  const isToday = task.dueDate === todayStr();
  let topBarClass = 'normal';
  if(overdue) topBarClass = 'overdue';
  else if(isToday && !task.done) topBarClass = 'today';

  panel.innerHTML = `
    <div class="tp-top-flag ${topBarClass}"></div>

    <div class="tp-field">
      <div class="tp-name-row">
        <div class="task-check task-check-circle ${task.done?'done':''}" id="tpDoneCheck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
        <input type="text" class="tp-name-input ${task.done?'done':''}" id="tpName" placeholder="Nome da tarefa" value="${escapeHtml(task.title||'')}" ${creatingNewTask ? '' : 'readonly'}>
        ${!creatingNewTask ? `
        <button type="button" class="tp-header-icon-btn" id="tpDuplicateBtn" title="Duplicar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
        <button type="button" class="tp-header-icon-btn danger" id="tpDeleteBtn" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg></button>
        ` : ''}
      </div>
      ${!creatingNewTask ? `<div class="tp-created-at">${task.shortId?`<strong>${task.shortId}</strong> · `:''}Criada em ${fmtUpdatedAt(task.createdAt)}</div>` : ''}
      ${task.done ? `<div class="tp-done-banner" id="tpDoneBanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Tarefa concluída</div>` : ''}
    </div>

    <div class="tp-field" style="position:relative;">
      <label class="tp-label">Espaço</label>
      <div class="cat-tags-combined-row">
        <div class="group-move-row">
          <button type="button" class="move-group-btn" id="tpMoveGroupBtn" title="Mover de espaço"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg></button>
          <span class="group-current-chip" id="tpGroupChip"></span>
        </div>
        <div class="tp-tags-selected" id="tpTagsSelected">
          ${(task.tagIds||[]).map(id => state.tags.find(tg=>tg.id===id)).filter(Boolean).map(tg => `<span class="tp-tag-chip active" data-tag-id="${tg.id}" title="Clique para remover" style="background:${tg.color}">${escapeHtml(tg.name)}</span>`).join('')}
          <button type="button" class="tp-tags-add-btn" id="tpTagsToggleBtn">+ Tag</button>
        </div>
      </div>
    </div>

    <div class="tp-field">
      <label class="tp-label">Descrição</label>
      <textarea class="tp-textarea" id="tpDesc" rows="4" placeholder="Detalhes da tarefa...">${escapeHtml(task.description||'')}</textarea>
    </div>

    <div class="tp-field">
      <div style="display:flex; align-items:center; gap:6px;">
        <label class="tp-label" style="margin-bottom:0;">Anexos</label>
        <button type="button" class="note-attach-btn" id="tpAttachBtn" title="Anexar arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.19 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
        <input type="file" id="tpAttachInput" multiple style="display:none;">
      </div>
      <div class="tp-attach-list" id="tpAttachList"></div>
    </div>

    <div class="tp-field">
      <div class="tp-row-mixed">
        <div class="tp-col-large">
          <label class="tp-label">Prazo e hora</label>
          <div class="tp-row2">
            <input type="date" class="tp-input tp-date-input" id="tpDate" value="${task.dueDate||''}">
            <input type="time" class="tp-input tp-time-input" id="tpTime" value="${task.dueTime||''}">
          </div>
        </div>
        <div class="tp-col-recurrence">
          <label class="tp-label">Recorrência</label>
          <button type="button" class="tp-status-trigger" id="tpRecurrenceTrigger">
            <svg class="tp-recurrence-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 014-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 01-4 4H3"/></svg>
            <span class="tp-status-trigger-label" id="tpRecurrenceTriggerLabel">${recurrenceSummaryLabel(task)}</span>
            <svg class="tp-status-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="tp-field">
      <div class="tp-row-mixed">
        <div class="tp-col-status">
          <label class="tp-label">Status</label>
          <div class="tp-status-select-wrap">
            <button type="button" class="tp-status-trigger" id="tpStatusTrigger">
              <span class="tp-status-icon status-${task.status||'nao_iniciado'}">${statusCircleSvg(task.status||'nao_iniciado')}</span>
              <span class="tp-status-trigger-label">${(STATUS_CONFIG.find(s=>s.key===(task.status||'nao_iniciado'))||STATUS_CONFIG[0]).label}</span>
              <svg class="tp-status-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="tp-status-dropdown" id="tpStatusDropdown" style="display:none;">
              ${STATUS_CONFIG.map(s => `
                <div class="tp-status-option ${task.status===s.key?'active':''}" data-s="${s.key}">
                  <span class="tp-status-icon status-${s.key}">${statusCircleSvg(s.key)}</span>
                  <span>${s.label}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
        <div class="tp-col-priority">
          <label class="tp-label">Prioridade</label>
          <div class="tp-priority-group" id="tpPriorityGroup">
            ${PRIORITY_CONFIG.map(p => `<button type="button" class="tp-priority-btn ${task.priority===p.key?'active':''}" data-p="${p.key}">${p.label}</button>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="tp-field">
      <div class="tp-subtask-header-row">
        <label class="tp-label" style="margin-bottom:0;">Subtarefas (${(task.subtasks||[]).filter(s=>s.done).length}/${(task.subtasks||[]).length})</label>
        ${task.subtasks && task.subtasks.length ? `<span class="tp-subtask-progress-pct">${Math.round((task.subtasks.filter(s=>s.done).length/task.subtasks.length)*100)}%</span>` : ''}
      </div>
      ${task.subtasks && task.subtasks.length ? `
        <div class="tp-subtask-progress-bar">
          <div class="tp-subtask-progress-fill" style="width:${Math.round((task.subtasks.filter(s=>s.done).length/task.subtasks.length)*100)}%;"></div>
        </div>
      ` : ''}
      <div id="tpSubtaskList"></div>
      <div class="tp-add-inline">
        <input type="text" id="tpNewSubtask" placeholder="+ Adicionar subtarefa">
      </div>
    </div>

    <div class="tp-field tp-agenda-notes-row">
      <div class="tp-agenda-notes-col" id="tpAgendaField">
        <label class="tp-label">Agenda</label>
        <div id="tpAgendaList"></div>
        <button type="button" class="btn ghost small" id="tpAddAgendaBtn">+ Criar agenda</button>
      </div>
      <div class="tp-agenda-notes-col" id="tpNotesField">
        <label class="tp-label">Notas</label>
        <div id="tpNotesList"></div>
        <button type="button" class="btn ghost small" id="tpAddNoteBtn">+ Criar nota</button>
      </div>
    </div>

    <div class="tp-field">
      <label class="tp-label">Comentários</label>
      <div class="tp-add-inline" style="flex-direction:column; align-items:stretch; border-top:none; padding-top:0; margin-top:0;">
        <textarea class="tp-textarea" id="tpNewComment" placeholder="Escrever um comentário..." style="min-height:44px; margin-bottom:6px;"></textarea>
        <button type="button" class="btn small" id="tpAddCommentBtn" style="align-self:flex-end;">Comentar</button>
      </div>
      <div id="tpCommentList" style="margin-top:12px;"></div>
    </div>
  `;

  const tpDuplicateBtn = document.getElementById('tpDuplicateBtn');
  if(tpDuplicateBtn){
    tpDuplicateBtn.onclick = (e) => {
      const copy = JSON.parse(JSON.stringify(task));
      copy.id = uid('task');
      state.taskIdCounter = (state.taskIdCounter || 0) + 1;
      copy.shortId = String(state.taskIdCounter).padStart(4, '0');
      copy.title = task.title + ' (cópia)';
      copy.done = false;
      copy.status = 'nao_iniciado';
      copy.createdAt = Date.now();
      (copy.subtasks||[]).forEach(s => s.id = uid('sub'));
      (copy.comments||[]).forEach(c => c.id = uid('cmt'));
      state.tasks.push(copy);
      markDirty();
      openTaskPanel(copy.id);
    };
  }
  const tpDeleteBtn = document.getElementById('tpDeleteBtn');
  if(tpDeleteBtn){
    tpDeleteBtn.onclick = (e) => {
      e.stopPropagation();
      openConfirmPortal(e.currentTarget, 'Excluir esta tarefa?', () => {
        state.tasks = state.tasks.filter(x => x.id !== task.id);
        activeTaskId = null;
        markDirty();
      });
    };
  }

  const tpNameEl = document.getElementById('tpName');
  tpNameEl.addEventListener('click', () => {
    if(tpNameEl.hasAttribute('readonly')){
      tpNameEl.removeAttribute('readonly');
      tpNameEl.focus();
    }
  });
  tpNameEl.addEventListener('blur', e => {
    const v = e.target.value.trim();
    if(!v && creatingNewTask) return; // nada digitado ainda, não cria
    const t = getOrCreateActiveTask();
    if(!t) return;
    t.title = v;
    if(!creatingNewTask) tpNameEl.setAttribute('readonly', '');
    markDirty();
  });
  tpNameEl.addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });

  document.getElementById('tpDoneCheck').onclick = () => {
    const t = getOrCreateActiveTask(); if(!t) return;
    const wasDone = t.done;
    t.done = !t.done;
    t.status = t.done ? 'concluida' : 'nao_iniciado';
    t.completedAt = t.done ? Date.now() : null;
    if(!wasDone && t.done && t.recurrence && t.recurrence !== 'none'){
      const next = spawnNextRecurrence(t);
      if(next){
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        markDirty();
        openTaskPanel(next.id);
        return;
      }
    }
    markDirty();
  };

  const tpStatusTrigger = document.getElementById('tpStatusTrigger');
  const tpStatusDropdown = document.getElementById('tpStatusDropdown');
  tpStatusTrigger.onclick = (e) => {
    e.stopPropagation();
    const isOpen = tpStatusDropdown.style.display === 'block';
    tpStatusDropdown.style.display = isOpen ? 'none' : 'block';
  };
  tpStatusDropdown.addEventListener('click', e => e.stopPropagation());
  tpStatusDropdown.querySelectorAll('.tp-status-option').forEach(opt => {
    opt.onclick = () => {
      const t = getOrCreateActiveTask(); if(!t) return;
      const s = opt.dataset.s;
      t.status = s;
      t.done = (s === 'concluida');
      t.completedAt = t.done ? Date.now() : null;
      tpStatusDropdown.style.display = 'none';
      if(t.done && t.recurrence && t.recurrence !== 'none'){
        const next = spawnNextRecurrence(t);
        if(next){
          state.tasks = state.tasks.filter(x => x.id !== t.id);
          markDirty();
          openTaskPanel(next.id);
          return;
        }
      }
      markDirty();
    };
  });

  function renderTpGroupChip(){
    const cat = catById(task.categoryId);
    const chip = document.getElementById('tpGroupChip');
    chip.style.background = cat ? cat.color + '22' : 'var(--surface-2)';
    chip.style.color = cat ? cat.color : 'var(--ink-soft)';
    chip.innerHTML = `<span class="cat-swatch" style="background:${cat?cat.color:'var(--ink-faint)'}"></span>${escapeHtml(cat?cat.name:'Sem espaço')}`;
  }
  renderTpGroupChip();
  document.getElementById('tpMoveGroupBtn').onclick = (e) => {
    e.stopPropagation();
    openMoveGroupPortal(e.currentTarget, task.categoryId, (newCatId) => {
      const t = getOrCreateActiveTask(); if(!t) return;
      t.categoryId = newCatId;
      task.categoryId = newCatId;
      t.tagIds = (t.tagIds||[]).filter(id => {
        const tg = state.tags.find(x => x.id === id);
        return tg && (!tg.categoryId || tg.categoryId === t.categoryId);
      });
      renderTpGroupChip();
      markDirty();
    });
  };

  function renderTpAgendaList(){
    const box = document.getElementById('tpAgendaList');
    if(!box) return;
    const linked = state.events.filter(ev => ev.linkedTaskId === task.id)
      .sort((a,b) => (a.date||'').localeCompare(b.date||''));
    if(linked.length === 0){
      box.innerHTML = '';
      return;
    }
    box.innerHTML = linked.map(ev => `
      <div class="tp-task-agenda-row" data-event-id="${ev.id}">
        <span class="dot" style="background:${eventColor(ev)}"></span>
        <div class="tp-task-agenda-body">
          <div class="tp-task-agenda-date">${fmtDate(ev.date)}${ev.startTime?' '+ev.startTime:''}</div>
          <div class="tp-task-agenda-title">${escapeHtml(ev.title||'Sem título')}</div>
        </div>
      </div>
    `).join('');
    box.querySelectorAll('.tp-task-agenda-row').forEach(row => {
      row.style.cursor = 'pointer';
      row.onclick = () => {
        const ev = state.events.find(x => x.id === row.dataset.eventId);
        if(ev) openEventComposer(ev);
      };
    });
  }
  renderTpAgendaList();
  document.getElementById('tpAddAgendaBtn').onclick = (e) => {
    e.stopPropagation();
    const t = getOrCreateActiveTask(); if(!t) return;
    openEventComposer(null, t.dueDate || todayStr(), t.id);
  };

  function renderTpNotesList(){
    const box = document.getElementById('tpNotesList');
    if(!box) return;
    const linked = state.notes.filter(n => n.linkedTaskId === task.id)
      .sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    if(linked.length === 0){
      box.innerHTML = '';
      return;
    }
    box.innerHTML = linked.map(n => `
      <div class="tp-task-agenda-row" data-note-id="${n.id}">
        <span class="dot" style="background:var(--ink-faint)"></span>
        <span class="tp-task-agenda-date">${fmtUpdatedAt(n.updatedAt)}</span>
        <span class="tp-task-agenda-title">${escapeHtml(n.title||'Sem título')}</span>
      </div>
    `).join('');
    box.querySelectorAll('.tp-task-agenda-row').forEach(row => {
      row.style.cursor = 'pointer';
      row.onclick = () => {
        const n = state.notes.find(x => x.id === row.dataset.noteId);
        if(n){ currentView = 'notes'; render(); openNoteComposer(n); }
      };
    });
  }
  renderTpNotesList();
  document.getElementById('tpAddNoteBtn').onclick = (e) => {
    e.stopPropagation();
    const t = getOrCreateActiveTask(); if(!t) return;
    currentView = 'notes';
    render();
    openNoteComposer(null, t.id);
  };

  document.getElementById('tpDesc').addEventListener('blur', e => {
    const t = getOrCreateActiveTask(); if(!t) return;
    t.description = e.target.value; markDirty();
  });

  /* Mantido em memória local (não cria a tarefa nova no state só por abrir o
     painel) e só é commitado via getOrCreateActiveTask() quando o usuário de
     fato anexa ou remove algo — igual ao resto dos campos deste painel. */
  let tpAttachments = (task.attachments||[]).slice();
  function renderTpAttachments(){
    const list = document.getElementById('tpAttachList');
    if(!list) return;
    list.innerHTML = '';
    tpAttachments.forEach(att => {
      const isImage = (att.type||'').startsWith('image/');
      const row = document.createElement('div');
      row.className = 'tp-attach-row';
      row.innerHTML = `
        ${isImage ? `<img src="${att.dataUrl}" alt="" class="tp-attach-thumb-img">` : `<span class="tp-attach-file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></span>`}
        <span class="tp-attach-name" title="${escapeHtml(att.name||'')}">${escapeHtml(att.name||'Arquivo')}</span>
        <button type="button" class="tp-attach-del" title="Remover">×</button>
      `;
      row.querySelector(isImage ? '.tp-attach-thumb-img' : '.tp-attach-file-icon').onclick = () => window.open(att.dataUrl, '_blank');
      row.querySelector('.tp-attach-del').onclick = () => {
        tpAttachments = tpAttachments.filter(a => a.id !== att.id);
        const t = getOrCreateActiveTask(); if(t) { t.attachments = tpAttachments; markDirty(); }
        renderTpAttachments();
      };
      list.appendChild(row);
    });
  }
  renderTpAttachments();
  document.getElementById('tpAttachBtn').onclick = () => document.getElementById('tpAttachInput').click();
  document.getElementById('tpAttachInput').addEventListener('change', e => {
    const MAX_SIZE = 4 * 1024 * 1024;
    Array.from(e.target.files||[]).forEach(file => {
      if(file.size > MAX_SIZE){
        alert(`"${file.name}" tem mais de 4 MB e não foi anexado — arquivos muito grandes deixam a sincronização mais lenta.`);
        return;
      }
      const reader = new FileReader();
      reader.onload = ev => {
        tpAttachments.push({ id: uid('att'), name: file.name, type: file.type || '', dataUrl: ev.target.result });
        const t = getOrCreateActiveTask(); if(t) { t.attachments = tpAttachments; markDirty(); }
        renderTpAttachments();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  document.getElementById('tpDate').addEventListener('change', e => {
    const t = getOrCreateActiveTask(); if(!t) return;
    t.dueDate = e.target.value || null; markDirty();
  });
  document.getElementById('tpTime').addEventListener('change', e => {
    const t = getOrCreateActiveTask(); if(!t) return;
    t.dueTime = e.target.value || null; markDirty();
  });

  panel.querySelectorAll('.tp-priority-btn').forEach(btn => {
    btn.onclick = () => {
      const t = getOrCreateActiveTask(); if(!t) return;
      t.priority = (t.priority === btn.dataset.p) ? null : btn.dataset.p;
      markDirty();
    };
  });

  document.getElementById('tpTagsToggleBtn').onclick = (e) => {
    e.stopPropagation();
    const portal = ensureTagsPortal();
    const wasOpen = portal.classList.contains('show');
    closeTagsPortal();
    if(wasOpen) return;
    portal.classList.add('show');
    positionTagsPortalNear(portal, e.currentTarget);
    portal.onclick = e2 => e2.stopPropagation();
    renderUnifiedTagPicker(portal, {
      categoryId: task.categoryId,
      isSelected: (tagId) => (task.tagIds||[]).includes(tagId),
      onToggle: (tagId) => {
        const t = getOrCreateActiveTask(); if(!t) return;
        t.tagIds = t.tagIds || [];
        if(t.tagIds.includes(tagId)) t.tagIds = t.tagIds.filter(id => id !== tagId);
        else t.tagIds.push(tagId);
        task.tagIds = t.tagIds;
        persistOnly();
        renderTpTagsSelected();
      },
      onChanged: () => { renderTpTagsSelected(); }
    });
  };

  function renderTpTagsSelected(){
    const box = document.getElementById('tpTagsSelected');
    if(!box) return;
    const addBtn = box.querySelector('#tpTagsToggleBtn');
    box.querySelectorAll('.tp-tag-chip').forEach(el => el.remove());
    (task.tagIds||[]).map(id => state.tags.find(tg=>tg.id===id)).filter(Boolean).forEach(tg => {

const RT_ICONS = {
  alignLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h14"/></svg>',
  alignCenter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M5 18h14"/></svg>',
  alignRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M10 12h10M6 18h14"/></svg>',
  bulletList: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 6h10M9.5 12h10M9.5 18h10"/></svg>',

const ICS_FEED_BASE_URL = SUPABASE_URL + '/functions/v1/ics-feed';
function generateIcsToken(){
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}
async function fetchIcsToken(){
  if(!sbClient || !cloudSession) return null;
  const { data, error } = await sbClient.from('taskin_state').select('ics_token').eq('user_id', cloudSession.user.id).maybeSingle();
  if(error){ console.error(error); return null; }
  return data ? data.ics_token : null;
}
async function regenerateIcsToken(){
  if(!sbClient || !cloudSession) return null;
  const token = generateIcsToken();
  const { error } = await sbClient.from('taskin_state').update({ ics_token: token }).eq('user_id', cloudSession.user.id);
  if(error) throw error;
  return token;
}

function renderCatRows(focusId){
  const rows = document.getElementById('catRows');
  if(!rows) return;
  rows.innerHTML = '';
  const ordered = getOrderedCategories();
  const isCustom = state.categoryOrder === 'custom';
  ordered.forEach((cat, idx) => {
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <button type="button" class="fav-star-btn ${state.defaultCategoryFilter===cat.id?'active':''}" title="Definir como espaço padrão"><svg viewBox="0 0 24 24" fill="${state.defaultCategoryFilter===cat.id?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
      <input type="color" value="${cat.color}">
      <input type="text" value="${escapeHtml(cat.name)}">
      ${isCustom ? `
        <button type="button" class="reorder-btn" data-dir="up" ${idx===0?'disabled':''} title="Mover para cima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button type="button" class="reorder-btn" data-dir="down" ${idx===ordered.length-1?'disabled':''} title="Mover para baixo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      ` : ''}
      <button title="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg></button>
    `;
    if(isCustom){
      row.querySelectorAll('.reorder-btn').forEach(btn => {
        btn.onclick = () => {
          const realIdx = state.categories.findIndex(c => c.id === cat.id);
          const dir = btn.dataset.dir === 'up' ? -1 : 1;
          const swapIdx = realIdx + dir;
          if(swapIdx < 0 || swapIdx >= state.categories.length) return;
          [state.categories[realIdx], state.categories[swapIdx]] = [state.categories[swapIdx], state.categories[realIdx]];
          markDirty();
          renderCatRows();
        };
      });
    }
    row.querySelector('.fav-star-btn').onclick = () => {
      state.defaultCategoryFilter = state.defaultCategoryFilter === cat.id ? null : cat.id;
      markDirty();
      renderCatRows();
    };
    row.querySelector('input[type=color]').oninput = e => { cat.color = e.target.value; markDirty(); renderCatRows(); };
    const nameInput = row.querySelector('input[type=text]');
    nameInput.addEventListener('blur', e => { cat.name = e.target.value.trim() || cat.name; markDirty(); });
    nameInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
    row.querySelector('button[title="Remover"]').onclick = (e) => {
      e.stopPropagation();
      if(state.categories.length === 1){ alert('Mantenha ao menos um espaço.'); return; }
      openConfirmPortal(e.currentTarget, `Remover "${cat.name}"? Tarefas e notas desse espaço serão movidas para o primeiro espaço disponível.`, () => {
        const fallback = state.categories.find(c => c.id !== cat.id);
        state.tasks.forEach(t => { if(t.categoryId === cat.id) t.categoryId = fallback.id; });
        state.notes.forEach(n => { if(n.categoryId === cat.id) n.categoryId = fallback.id; });
        state.categories = state.categories.filter(c => c.id !== cat.id);
        if(activeCategoryFilter === cat.id) activeCategoryFilter = null;
        if(state.defaultCategoryFilter === cat.id) state.defaultCategoryFilter = null;
        markDirty();
        renderCatRows();
      });
    };
    rows.appendChild(row);
    if(cat.id === focusId){ nameInput.focus(); nameInput.select(); }
  });
}

function renderTagRows(focusId){
  const rows = document.getElementById('tagRows');
  if(!rows) return;
  rows.innerHTML = '';
  if(state.tags.length === 0){
    rows.innerHTML = `<p style="font-size:12.5px; color:var(--ink-faint);">Nenhuma tag criada ainda. Você também pode criar tags direto no painel de uma tarefa.</p>`;
  }
  const catOptions = `<option value="">Geral (todas)</option>` + state.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const ordered = getOrderedTags();
  const isCustom = state.tagOrder === 'custom';
  ordered.forEach((tag, idx) => {
    const row = document.createElement('div');
    row.className = 'cat-row tag-row-settings';
    row.innerHTML = `
      <input type="color" value="${tag.color}">
      <input type="text" value="${escapeHtml(tag.name)}">
      <select class="tag-cat-select">${catOptions}</select>
      ${isCustom ? `
        <button type="button" class="reorder-btn" data-dir="up" ${idx===0?'disabled':''} title="Mover para cima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button type="button" class="reorder-btn" data-dir="down" ${idx===ordered.length-1?'disabled':''} title="Mover para baixo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      ` : ''}
      <button title="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg></button>
    `;
    if(isCustom){
      row.querySelectorAll('.reorder-btn').forEach(btn => {
        btn.onclick = () => {
          const realIdx = state.tags.findIndex(t => t.id === tag.id);
          const dir = btn.dataset.dir === 'up' ? -1 : 1;
          const swapIdx = realIdx + dir;
          if(swapIdx < 0 || swapIdx >= state.tags.length) return;
          [state.tags[realIdx], state.tags[swapIdx]] = [state.tags[swapIdx], state.tags[realIdx]];
          markDirty();
          renderTagRows();
        };
      });
    }
    row.querySelector('.tag-cat-select').value = tag.categoryId || '';
    row.querySelector('input[type=color]').oninput = e => { tag.color = e.target.value; markDirty(); renderTagRows(); };
    const nameInput = row.querySelector('input[type=text]');
    nameInput.addEventListener('blur', e => { tag.name = e.target.value.trim() || tag.name; markDirty(); });
    nameInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
    row.querySelector('.tag-cat-select').addEventListener('change', e => {
      tag.categoryId = e.target.value || null;
      state.tasks.forEach(t => {
        if((t.tagIds||[]).includes(tag.id) && tag.categoryId && t.categoryId !== tag.categoryId){
          t.tagIds = t.tagIds.filter(id => id !== tag.id);
        }
      });
      markDirty();
    });
    row.querySelector('button').onclick = (e) => {
      e.stopPropagation();
      const usedIn = state.tasks.filter(t => (t.tagIds||[]).includes(tag.id)).length;
      const msg = usedIn > 0
        ? `Remover a tag "${tag.name}"? Ela será retirada de ${usedIn} tarefa(s).`
        : `Remover a tag "${tag.name}"?`;
      openConfirmPortal(e.currentTarget, msg, () => {
        state.tasks.forEach(t => { if(t.tagIds) t.tagIds = t.tagIds.filter(id => id !== tag.id); });
        state.tags = state.tags.filter(tg => tg.id !== tag.id);
        markDirty();
        renderTagRows();
      });
    };
    rows.appendChild(row);
    if(tag.id === focusId){ nameInput.focus(); nameInput.select(); }
  });
}

/* ---- recorte circular ---- */
const cropImgEl = () => document.getElementById('cropImg');
let cropState = { natW:0, natH:0, base:1, zoom:1, offX:0, offY:0, dragging:false, startMouse:{x:0,y:0}, startOff:{x:0,y:0} };
const CROP_SIZE = 220;

function openCropModal(dataUrl){
  const img = cropImgEl();
  img.onload = () => {
    cropState.natW = img.naturalWidth;
    cropState.natH = img.naturalHeight;
    cropState.base = Math.max(CROP_SIZE/cropState.natW, CROP_SIZE/cropState.natH);
    cropState.zoom = 1; cropState.offX = 0; cropState.offY = 0;
    document.getElementById('cropZoom').value = 1;
    updateCropTransform();
  };
  img.src = dataUrl;
  document.getElementById('cropOverlay').classList.add('show');
}

function cropBounds(){
  const total = cropState.base * cropState.zoom;
  const w = cropState.natW * total, h = cropState.natH * total;
  return { maxX: Math.max(0,(w-CROP_SIZE)/2), maxY: Math.max(0,(h-CROP_SIZE)/2), w, h, total };
}

function updateCropTransform(){
  const { maxX, maxY, w, h } = cropBounds();
  cropState.offX = Math.min(maxX, Math.max(-maxX, cropState.offX));
  cropState.offY = Math.min(maxY, Math.max(-maxY, cropState.offY));
  const img = cropImgEl();
  img.style.width = w+'px';
  img.style.height = h+'px';
  img.style.left = (CROP_SIZE/2 - w/2 + cropState.offX)+'px';
  img.style.top = (CROP_SIZE/2 - h/2 + cropState.offY)+'px';
}

const cropStageEl = document.getElementById('cropStage');
cropStageEl.addEventListener('mousedown', e => {
  cropState.dragging = true;
  cropState.startMouse = { x:e.clientX, y:e.clientY };
  cropState.startOff = { x:cropState.offX, y:cropState.offY };
});
window.addEventListener('mousemove', e => {
  if(!cropState.dragging) return;
  cropState.offX = cropState.startOff.x + (e.clientX - cropState.startMouse.x);
  cropState.offY = cropState.startOff.y + (e.clientY - cropState.startMouse.y);
  updateCropTransform();
});
window.addEventListener('mouseup', () => cropState.dragging = false);

document.getElementById('cropZoom').addEventListener('input', e => {
  cropState.zoom = parseFloat(e.target.value);
  updateCropTransform();
});

document.getElementById('cancelCropBtn').onclick = () => document.getElementById('cropOverlay').classList.remove('show');
let cropOverlayMouseDownOnBackdrop = false;
document.getElementById('cropOverlay').addEventListener('mousedown', e => {
  cropOverlayMouseDownOnBackdrop = (e.target.id === 'cropOverlay');
});
document.getElementById('cropOverlay').addEventListener('click', e => {
  if(e.target.id==='cropOverlay' && cropOverlayMouseDownOnBackdrop) e.target.classList.remove('show');
});

document.getElementById('applyCropBtn').onclick = () => {
  const { total } = cropBounds();
  const canvas = document.createElement('canvas');
  canvas.width = CROP_SIZE; canvas.height = CROP_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.translate(CROP_SIZE/2 + cropState.offX, CROP_SIZE/2 + cropState.offY);
  ctx.scale(total, total);
  ctx.drawImage(cropImgEl(), -cropState.natW/2, -cropState.natH/2);
  ctx.restore();
  tempAvatarData = canvas.toDataURL('image/png');
  const preview = document.getElementById('avatarPreview');
  if(preview) preview.innerHTML = avatarInnerHtml({ name: state.profile.name, avatar: tempAvatarData });
  document.getElementById('cropOverlay').classList.remove('show');
};

/* ===================== INDEXEDDB (handle do arquivo entre sessões) ===================== */
function openHandleDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('tyvraTasksDB', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle(key){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(key, handle){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error(e); }
}
async function idbDeleteHandle(key){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error(e); }
}

async function reconnectHandle(handle){
  try{
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileHandle = handle;
      await syncStateFromFile();
      dirty = false;
      closeLinkOverlay();
      updateFileStatus();
      render();
    } else {
      alert('Permissão não concedida. Você pode tentar novamente pelo botão "Conectar arquivo base".');
      closeLinkOverlay();
    }
  }catch(e){ console.error(e); closeLinkOverlay(); }
}

async function syncStateFromFile(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const parsed = JSON.parse(text);
      if(parsed && parsed.categories){
        state = parsed;
        normalizeState();
        applyTheme();
      }
    } else {
      await writeStateToFile();
    }
  }catch(e){ console.error(e); }
}

async function writeStateToFile(){
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(state, null, 2));
  await writable.close();
}

async function fetchCloudStateRow(){
  const { data, error } = await sbClient
    .from('taskin_state')
    .select('data')
    .eq('user_id', cloudSession.user.id)
    .maybeSingle();
  if(error) throw error;
  return data;
}
async function loadStateFromCloud(){
  const data = await fetchCloudStateRow();
  if(data && data.data && typeof data.data === 'object'){
    state = data.data;
  }
  normalizeState();
  if(!data){
    await writeStateToCloud();
  }
}

async function writeStateToCloud(){
  if(!cloudSession) return;
  const { error } = await sbClient.from('taskin_state').upsert({
    user_id: cloudSession.user.id,
    data: state,
    updated_at: new Date().toISOString()
  });
  if(error) throw error;
}

async function startCloudSession(){
  try{
    await loadStateFromCloud();
  }catch(e){ console.error('Erro ao carregar dados da nuvem', e); }
  if(cloudSession.user.email && state.profile.email !== cloudSession.user.email){
    state.profile.email = cloudSession.user.email;
  }
  applyTheme();
  if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
  if(state.calendarViewDefault) calendarView = state.calendarViewDefault;
  loadUiSession();
  closeLoginGate();
  handleOutlookRedirectFeedback();
  render();
  updateFileStatus();
  if(pendingOutlookToast){ showToast(pendingOutlookToast); pendingOutlookToast = null; }
}

function updateSearchClearBtnVisibility(){
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClearBtn');
  if(input && clearBtn) clearBtn.style.display = input.value ? 'flex' : 'none';
}
function clearSearchTerm(){
  searchTerm = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  updateSearchClearBtnVisibility();
}
function computeGlobalSearchResults(term){
  const t = term.trim().toLowerCase();
  if(!t) return { tasks:[], notes:[], events:[] };
  const tasks = state.tasks.filter(x => (x.title||'').toLowerCase().includes(t)).slice(0,5);
  const notes = state.notes.filter(x => !x.archived && ((x.title||'')+' '+stripHtml(x.body||'')).toLowerCase().includes(t)).slice(0,5);
  const events = state.events.filter(x => (x.title||'').toLowerCase().includes(t)).slice(0,5);
  return { tasks, notes, events };
}
function closeSearchResultsDropdown(){
  document.getElementById('searchResultsDropdown').style.display = 'none';
}
function renderSearchResultsDropdown(){
  const dd = document.getElementById('searchResultsDropdown');
  if(!searchTerm.trim()){ dd.style.display = 'none'; return; }
  const { tasks, notes, events } = computeGlobalSearchResults(searchTerm);
  if(!tasks.length && !notes.length && !events.length){
    dd.innerHTML = `<div class="search-results-empty">Nenhum resultado para "${escapeHtml(searchTerm)}"</div>`;
    dd.style.display = 'block';
    return;
  }
  function group(label, items, iconKey, iconBg, iconColor, metaFn){
    if(!items.length) return '';
    return `
      <div class="search-results-group-label">${label}</div>
      ${items.map(it => `
        <div class="search-result-row" data-kind="${iconKey}" data-id="${it.id}">
          <span class="search-result-icon" style="background:${iconBg}; color:${iconColor};">${PAGE_HEADER_ICONS[iconKey]}</span>
          <span class="search-result-title">${escapeHtml(it.title||'Sem título')}</span>
          <span class="search-result-meta">${metaFn(it)}</span>
        </div>
      `).join('')}
    `;
  }
  dd.innerHTML =
    group('Tarefas', tasks, 'tasks', 'var(--primary-light)', 'var(--primary)', t => t.dueDate ? fmtDate(t.dueDate) : '') +
    group('Notas', notes, 'notes', 'var(--accent-light)', 'var(--accent)', () => '') +
    group('Eventos', events, 'calendar', 'var(--priority-baixa-light)', 'var(--priority-baixa)', ev => ev.date ? fmtDate(ev.date) : '');
  if(window.innerWidth <= 768){
    const wrapRect = document.getElementById('searchWrap').getBoundingClientRect();
    dd.style.position = 'fixed';
    dd.style.left = '16px';
    dd.style.right = '16px';
    dd.style.top = (wrapRect.bottom + 8) + 'px';
  } else {
    dd.style.position = '';
    dd.style.left = '';
    dd.style.right = '';
    dd.style.top = '';
  }
  dd.querySelectorAll('.search-result-row').forEach(row => {
    row.onclick = () => {
      const kind = row.dataset.kind;
      const id = row.dataset.id;
      clearSearchTerm();
      closeSearchResultsDropdown();
      if(kind === 'tasks'){
        currentView = 'tasks'; activeTaskId = id; creatingNewTask = false; render();
      } else if(kind === 'notes'){
        currentView = 'notes'; render();
        const n = state.notes.find(x => x.id === id);
        if(n) openNoteComposer(n);
      } else if(kind === 'calendar'){
        const ev = state.events.find(x => x.id === id);
        if(ev) openEventComposer(ev);
      }
    };
  });
  dd.style.display = 'block';
}
function computeNotifItems(){
  const today = todayStr();
  const overdueTasks = state.tasks.filter(t => !t.done && t.dueDate && t.dueDate < today)
    .sort((a,b) => (a.dueDate||'').localeCompare(b.dueDate||''));
  const todayTasks = state.tasks.filter(t => !t.done && t.dueDate === today);
  const todayEvents = eventsInScope().filter(ev => ev.date === today)
    .sort((a,b) => (a.startTime||'00:00').localeCompare(b.startTime||'00:00'));
  return { overdueTasks, todayTasks, todayEvents };
}
function updateNotifBadge(){
  const { overdueTasks, todayTasks, todayEvents } = computeNotifItems();
  const count = overdueTasks.length + todayTasks.length + todayEvents.length;
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  badge.textContent = count > 9 ? '9+' : String(count);
  badge.style.display = count > 0 ? 'block' : 'none';
}
function renderNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  const { overdueTasks, todayTasks, todayEvents } = computeNotifItems();
  if(!overdueTasks.length && !todayTasks.length && !todayEvents.length){
    dd.innerHTML = `<div class="notif-dropdown-empty">Nenhuma pendência por aqui. 🎉</div>`;
    dd.style.display = 'block';
    return;
  }
  function group(label, items, iconKey, iconBg, iconColor, metaFn, extraClass){
    if(!items.length) return '';
    return `
      <div class="search-results-group-label">${label}</div>
      ${items.map(it => `
        <div class="search-result-row ${extraClass||''}" data-kind="${iconKey}" data-id="${it.id}">
          <span class="search-result-icon" style="background:${iconBg}; color:${iconColor};">${PAGE_HEADER_ICONS[iconKey]}</span>
          <span class="search-result-title">${escapeHtml(it.title||'Sem título')}</span>
          <span class="search-result-meta">${metaFn(it)}</span>
        </div>
      `).join('')}
    `;
  }
  dd.innerHTML =
    group('Atrasadas', overdueTasks, 'tasks', 'var(--danger-light)', 'var(--danger)', t => fmtDate(t.dueDate), 'notif-overdue') +
    group('Tarefas de hoje', todayTasks, 'tasks', 'var(--primary-light)', 'var(--primary)', t => t.dueTime || '') +
    group('Agenda de hoje', todayEvents, 'calendar', 'var(--priority-baixa-light)', 'var(--priority-baixa)', ev => ev.allDay ? '' : (ev.startTime||''));
  dd.querySelectorAll('.search-result-row').forEach(row => {
    row.onclick = () => {
      const kind = row.dataset.kind;
      const id = row.dataset.id;
      closeNotifDropdown();
      if(kind === 'tasks'){
        currentView = 'tasks'; activeTaskId = id; creatingNewTask = false; render();
      } else if(kind === 'calendar'){
        const ev = state.events.find(x => x.id === id);
        if(ev) openEventComposer(ev);
      }
    };
  });
  dd.style.display = 'block';
}
function closeNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  if(dd) dd.style.display = 'none';
}

/* ===================== RENDER PRINCIPAL ===================== */
const VIEW_TITLES = { dashboard:'Visão geral', tasks:'Tarefas', notes:'Notas', calendar:'Calendário', settings:'Configurações' };
function saveUiSession(){
  try{
    sessionStorage.setItem('taskinUiSession', JSON.stringify({ currentView, activeCategoryFilter }));
  }catch(e){}
}
function loadUiSession(){
  try{
    const raw = sessionStorage.getItem('taskinUiSession');
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && typeof saved.currentView === 'string' && VIEW_TITLES[saved.currentView]) currentView = saved.currentView;
    if(saved && (typeof saved.activeCategoryFilter === 'string' || saved.activeCategoryFilter === null)) activeCategoryFilter = saved.activeCategoryFilter;
  }catch(e){}
}
let lastRenderedView = null;
function render(){
  saveUiSession();
  if(currentView !== lastRenderedView){
    lastRenderedView = currentView;
    refreshFromCloudIfSafe();
  }
  renderSpaceSelector();
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  document.getElementById('viewTitle').textContent = VIEW_TITLES[currentView];
  renderPageHeaderMeta();
  const subtitleEl = document.getElementById('viewSubtitle');
  if(currentView === 'dashboard'){
    const focusD = new Date(todayStr()+'T00:00:00');
    subtitleEl.textContent = `${WEEKDAY_FULL_LABELS[focusD.getDay()]}, ${focusD.getDate()} de ${MONTH_LABELS[focusD.getMonth()]} de ${focusD.getFullYear()}`;
    subtitleEl.style.display = 'block';
  } else {
    subtitleEl.style.display = 'none';
  }
  document.getElementById('dashboardView').style.display = currentView === 'dashboard' ? 'block' : 'none';
  document.getElementById('tasksView').style.display = currentView === 'tasks' ? 'block' : 'none';
  document.getElementById('notesView').style.display = currentView === 'notes' ? 'block' : 'none';
  document.getElementById('calendarView').style.display = currentView === 'calendar' ? 'block' : 'none';
  document.getElementById('settingsView').style.display = currentView === 'settings' ? 'block' : 'none';
  document.getElementById('searchWrap').style.display = 'flex';
  const addBtn = document.getElementById('primaryAddBtn');
  if(currentView === 'settings' || currentView === 'dashboard'){
    addBtn.style.display = 'none';
  } else {
    addBtn.style.display = 'flex';
    addBtn.title = currentView === 'tasks' ? 'Nova tarefa' : currentView === 'calendar' ? 'Nova agenda' : 'Nova nota';
  }
  addBtn.classList.toggle('shifted', currentView === 'tasks' && (activeTaskId || creatingNewTask));
  renderProfileCard();
  updateNotifBadge();
  if(document.getElementById('helpPanel').classList.contains('show')) renderHelpPanelContent();
  renderSidebarCats();
  if(currentView === 'dashboard') renderDashboard();
  else if(currentView === 'tasks') renderTasks();
  else if(currentView === 'notes') renderNotes();
  else if(currentView === 'calendar') renderCalendar();
  else renderSettingsView();
  updateFileStatus();
}

/* ===================== INIT ===================== */
async function boot(){
  loadFromLocalStorage();
  applyTheme();
  if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
  if(state.calendarViewDefault) calendarView = state.calendarViewDefault;

  if(sbClient){
    try{
      const { data } = await sbClient.auth.getSession();
      if(data && data.session){
        if(!isEmailAllowed(data.session.user.email)){
          await sbClient.auth.signOut();
          render();
          renderLoginGate('Esta conta não tem acesso ao DOUNO Tasks.');
          document.getElementById('loginOverlay').classList.add('show');
          return;
        }
        cloudSession = data.session;
        await startCloudSession();
        return;
      }
    }catch(e){ console.error(e); }
    render();
    renderLoginGate();
    document.getElementById('loginOverlay').classList.add('show');
    return;
  }

  if(FS_SUPPORTED){
    try{
      const storedHandle = await idbGetHandle('main');
      if(storedHandle){
        const perm = await storedHandle.queryPermission({ mode:'readwrite' });
        if(perm === 'granted'){
          fileHandle = storedHandle;
          await syncStateFromFile();
          applyTheme();
          if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
          if(state.calendarViewDefault) calendarView = state.calendarViewDefault;
          loadUiSession();
          render();
          updateFileStatus();
          return;
        }
        render();
        renderLinkModal('reconnect', storedHandle);
        openLinkOverlay();
        updateFileStatus();
        return;
      }
    }catch(e){ console.error(e); }
  }

  render();
  initFileLink();
}
boot();
